name: Deploy Static Worker

on:
  workflow_call:
    inputs:
      vault-project: { required: true, type: string }
      vault-environment: { required: false, default: production, type: string }
      worker-name: { required: true, type: string }
      route-hostname: { required: true, type: string }
      deployment-url: { required: true, type: string }
      build-secret-names: { required: true, type: string }
      wrangler-config: { required: false, default: wrangler.jsonc, type: string }
    secrets:
      THECODEORIGIN_VAULT_TOKEN: { required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: Production
      url: ${{ inputs.deployment-url }}
    env:
      TARGET_VAULT_PROJECT: ${{ inputs.vault-project }}
      TARGET_VAULT_ENVIRONMENT: ${{ inputs.vault-environment }}
      TARGET_WORKER: ${{ inputs.worker-name }}
      TARGET_ROUTE: ${{ inputs.route-hostname }}
      TARGET_WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
      BUILD_SECRET_NAMES: ${{ inputs.build-secret-names }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 11.22.0 }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Load production environment from Vault
        uses: thecodeorigin/actions/vault-environment@4bff26b9e9ac41c293f82a294a5eb2a262648a87
        with:
          token: ${{ secrets.THECODEORIGIN_VAULT_TOKEN }}
          project: ${{ inputs.vault-project }}
          environment: ${{ inputs.vault-environment }}
          deployment-kind: production

      - name: Build with allowlisted Vault values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          build_file="$RUNNER_TEMP/build-secrets.json"
          trap 'rm -f "$build_file"' EXIT
          export BUILD_SECRETS_FILE="$build_file"
          node -e 'process.stdout.write(JSON.stringify(process.env))' \
            | jq --argjson names "$BUILD_SECRET_NAMES" \
                'with_entries(select(.key as $key | $names | index($key)))' > "$build_file"
          jq -e --argjson names "$BUILD_SECRET_NAMES" \
            '(. | keys | sort) == ($names | sort) and all(.[]; type == "string" and length > 0)' \
            "$build_file" >/dev/null
          node <<'NODE'
          const { readFileSync, unlinkSync } = require('node:fs')
          const { spawnSync } = require('node:child_process')
          const file = process.env.BUILD_SECRETS_FILE
          const env = Object.fromEntries(['PATH', 'HOME', 'TMPDIR', 'CI', 'NODE_OPTIONS'].filter(key => process.env[key] !== undefined).map(key => [key, process.env[key]]))
          try {
            const values = JSON.parse(readFileSync(file, 'utf8'))
            if (Object.keys(values).some(key => /^(THECODEORIGIN_VAULT_TOKEN$|CLOUDFLARE_(API_TOKEN|TOKEN|D1_TOKEN)$|DOPPLER_|GH_|GITHUB_TOKEN$|SSH_|CF_ACCESS_)/.test(key)))
              throw new Error('Provider credentials are not allowed during builds')
            Object.assign(env, values)
            delete env.THECODEORIGIN_VAULT_TOKEN
            const result = spawnSync('pnpm', ['build'], { env, stdio: 'inherit', shell: false })
            process.exitCode = result.status ?? 1
          } finally {
            unlinkSync(file)
          }
          NODE

      - name: Validate generated deployment contract
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          jq -e --arg worker "$TARGET_WORKER" --arg route "$TARGET_ROUTE" '
            .name == $worker and
            any(.routes[]?; .pattern == $route and .custom_domain == true)
          ' "$TARGET_WRANGLER_CONFIG" >/dev/null

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cf_token="$CLOUDFLARE_API_TOKEN"
          cf_account="$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$cf_token"
          (
            unset THECODEORIGIN_VAULT_TOKEN
            export CLOUDFLARE_API_TOKEN="$cf_token" CLOUDFLARE_ACCOUNT_ID="$cf_account"
            pnpm exec wrangler deploy --config "$TARGET_WRANGLER_CONFIG" \
              --name "$TARGET_WORKER" --message "github:$GITHUB_SHA"
          )
