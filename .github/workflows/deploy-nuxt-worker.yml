name: Deploy Nuxt Worker

on:
  workflow_call:
    inputs:
      vault-project: { required: true, type: string }
      vault-environment: { required: false, default: production, type: string }
      worker-name: { required: true, type: string }
      route-hostname: { required: true, type: string }
      deployment-url: { required: true, type: string }
      build-secret-names:
        description: JSON array of Vault keys exposed to pnpm build
        required: true
        type: string
      wrangler-config:
        required: false
        default: .output/server/wrangler.json
        type: string
      node-options: { required: false, default: '', type: string }
      has-kv: { required: false, default: true, type: boolean }
      vectorize-index: { required: false, default: '', type: string }
      require-email-binding: { required: false, default: false, type: boolean }
      required-worker-main:
        description: Exact generated Worker entry required when a wrapper enforces runtime semantics
        required: false
        default: ''
        type: string
    secrets:
      THECODEORIGIN_VAULT_TOKEN: { required: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: Production
      url: ${{ inputs.deployment-url }}
    env:
      TARGET_VAULT_PROJECT: ${{ inputs.vault-project }}
      TARGET_VAULT_ENVIRONMENT: ${{ inputs.vault-environment }}
      TARGET_WORKER: ${{ inputs.worker-name }}
      TARGET_ROUTE: ${{ inputs.route-hostname }}
      TARGET_WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
      BUILD_SECRET_NAMES: ${{ inputs.build-secret-names }}
      NODE_OPTIONS: ${{ inputs.node-options }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 11.22.0 }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Load production environment from Vault
        uses: thecodeorigin/actions/vault-environment@4bff26b9e9ac41c293f82a294a5eb2a262648a87
        with:
          token: ${{ secrets.THECODEORIGIN_VAULT_TOKEN }}
          project: ${{ inputs.vault-project }}
          environment: ${{ inputs.vault-environment }}
          deployment-kind: production

      - name: Build with allowlisted Vault values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          build_file="$RUNNER_TEMP/build-secrets.json"
          trap 'rm -f "$build_file"' EXIT
          export BUILD_SECRETS_FILE="$build_file"
          node -e 'process.stdout.write(JSON.stringify(process.env))' \
            | jq --argjson names "$BUILD_SECRET_NAMES" \
                'with_entries(select(.key as $key | $names | index($key)))' > "$build_file"
          jq -e --argjson names "$BUILD_SECRET_NAMES" \
            '(. | keys | sort) == ($names | sort) and all(.[]; type == "string" and length > 0)' \
            "$build_file" >/dev/null
          node <<'NODE'
          const { readFileSync, unlinkSync } = require('node:fs')
          const { spawnSync } = require('node:child_process')
          const file = process.env.BUILD_SECRETS_FILE
          const env = Object.fromEntries(['PATH', 'HOME', 'TMPDIR', 'CI', 'NODE_OPTIONS'].filter(key => process.env[key] !== undefined).map(key => [key, process.env[key]]))
          try {
            const values = JSON.parse(readFileSync(file, 'utf8'))
            if (Object.keys(values).some(key => /^(THECODEORIGIN_VAULT_TOKEN$|CLOUDFLARE_(API_TOKEN|TOKEN|D1_TOKEN)$|DOPPLER_|GH_|GITHUB_TOKEN$|SSH_|CF_ACCESS_)/.test(key)))
              throw new Error('Provider credentials are not allowed during builds')
            Object.assign(env, values)
            delete env.THECODEORIGIN_VAULT_TOKEN
            const result = spawnSync('pnpm', ['build'], { env, stdio: 'inherit', shell: false })
            process.exitCode = result.status ?? 1
          } finally {
            unlinkSync(file)
          }
          NODE

      - name: Validate generated deployment contract
        env:
          HAS_KV: ${{ inputs.has-kv }}
          VECTORIZE_INDEX: ${{ inputs.vectorize-index }}
          REQUIRE_EMAIL: ${{ inputs.require-email-binding }}
          REQUIRED_WORKER_MAIN: ${{ inputs.required-worker-main }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets="$(node -e 'process.stdout.write(JSON.stringify(process.env))')"
          db_id="$(jq -er '.CLOUDFLARE_D1_DATABASE_ID' <<<"$secrets")"
          r2_name="$(jq -er '.CLOUDFLARE_R2_BUCKET' <<<"$secrets")"
          jq -e --arg worker "$TARGET_WORKER" --arg route "$TARGET_ROUTE" \
            --arg db "$db_id" --arg r2 "$r2_name" '
              .name == $worker and
              any(.routes[]?; .pattern == $route and .custom_domain == true) and
              any(.d1_databases[]?; .binding == "DB" and .database_id == $db) and
              any(.r2_buckets[]?; .binding == "BLOB" and .bucket_name == $r2)
            ' "$TARGET_WRANGLER_CONFIG" >/dev/null
          if [ "$HAS_KV" = true ]; then
            kv_id="$(jq -er '.CLOUDFLARE_KV_NAMESPACE_ID' <<<"$secrets")"
            cache_id="$(jq -er '.CLOUDFLARE_CACHE_NAMESPACE_ID' <<<"$secrets")"
            test "$kv_id" != "$cache_id"
            jq -e --arg kv "$kv_id" --arg cache "$cache_id" '
              any(.kv_namespaces[]?; .binding == "KV" and .id == $kv) and
              any(.kv_namespaces[]?; .binding == "CACHE" and .id == $cache)
            ' "$TARGET_WRANGLER_CONFIG" >/dev/null
          fi
          if [ -n "$VECTORIZE_INDEX" ]; then
            jq -e --arg index "$VECTORIZE_INDEX" \
              'any(.vectorize[]?; .index_name == $index)' "$TARGET_WRANGLER_CONFIG" >/dev/null
          fi
          if [ "$REQUIRE_EMAIL" = true ]; then
            EMAIL_CONTRACT_CONFIG="$TARGET_WRANGLER_CONFIG" EMAIL_CONTRACT_MAIN="$REQUIRED_WORKER_MAIN" EMAIL_CONTRACT_WORKER="$TARGET_WORKER" node <<'NODE'
          // EMAIL_DEPLOYMENT_CONTRACT_SCRIPT_START
          const { readFileSync } = require('node:fs')

          const config = JSON.parse(readFileSync(process.env.EMAIL_CONTRACT_CONFIG, 'utf8'))
          const requiredMain = process.env.EMAIL_CONTRACT_MAIN
          const worker = process.env.EMAIL_CONTRACT_WORKER
          const ingestQueue = `${worker}-ingest`
          const deadLetterQueue = `${ingestQueue}-dlq`
          const emailBindings = Array.isArray(config.send_email) ? config.send_email : []
          const producers = Array.isArray(config.queues?.producers) ? config.queues.producers : []
          const consumers = Array.isArray(config.queues?.consumers) ? config.queues.consumers : []

          function requireContract(condition, message) {
            if (!condition)
              throw new Error(`Invalid Email deployment contract: ${message}`)
          }

          const email = emailBindings.find(binding => binding.name === 'EMAIL')
          if (requiredMain)
            requireContract(config.main === requiredMain, `Worker entry must be ${requiredMain}`)
          requireContract(email, 'missing EMAIL binding')
          requireContract(!Object.hasOwn(email, 'remote'), 'production EMAIL binding must omit remote')
          requireContract(
            producers.some(producer => producer.binding === 'MAIL_INGEST_QUEUE' && producer.queue === ingestQueue),
            `missing MAIL_INGEST_QUEUE producer for ${ingestQueue}`,
          )
          requireContract(
            consumers.some(consumer =>
              consumer.queue === ingestQueue
              && consumer.max_retries === 5
              && consumer.dead_letter_queue === deadLetterQueue),
            `missing ingest consumer with ${deadLetterQueue} dead-letter queue`,
          )
          requireContract(
            consumers.some(consumer => consumer.queue === deadLetterQueue),
            `missing dead-letter consumer for ${deadLetterQueue}`,
          )
          // EMAIL_DEPLOYMENT_CONTRACT_SCRIPT_END
          NODE
          fi

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cf_token="$CLOUDFLARE_API_TOKEN"
          cf_account="$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$cf_token"
          (
            unset THECODEORIGIN_VAULT_TOKEN
            export CLOUDFLARE_API_TOKEN="$cf_token" CLOUDFLARE_ACCOUNT_ID="$cf_account"
            pnpm exec wrangler d1 migrations apply DB --remote --config "$TARGET_WRANGLER_CONFIG"
          )

      - name: Deploy code and runtime secrets atomically
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          runtime_file="$RUNNER_TEMP/runtime-secrets.json"
          trap 'rm -f "$runtime_file"' EXIT
          node -e 'process.stdout.write(JSON.stringify(process.env))' \
            | jq --slurpfile config "$TARGET_WRANGLER_CONFIG" '
                with_entries(select(.key | test("^(NUXT_|CRON_SECRET$)")))
                | with_entries(select(.key as $key | (($config[0].vars // {}) | has($key) | not)))
              ' > "$runtime_file"
          jq -e 'length > 0 and all(.[]; type == "string" and length > 0)' "$runtime_file" >/dev/null
          cf_token="$CLOUDFLARE_API_TOKEN"
          cf_account="$CLOUDFLARE_ACCOUNT_ID"
          echo "::add-mask::$cf_token"
          (
            unset THECODEORIGIN_VAULT_TOKEN
            export CLOUDFLARE_API_TOKEN="$cf_token" CLOUDFLARE_ACCOUNT_ID="$cf_account"
            pnpm exec wrangler deploy --config "$TARGET_WRANGLER_CONFIG" \
              --name "$TARGET_WORKER" --secrets-file "$runtime_file" --message "github:$GITHUB_SHA"
          )
          node -e 'require("node:fs").unlinkSync(process.argv[1])' "$runtime_file"
